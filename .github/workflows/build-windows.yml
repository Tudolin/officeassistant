name: Build Windows Installer

on:
  push:
    branches:
      - claude/meeting-assistant-desktop-ye6066
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build app bundle
        run: npm run build

      - name: Build Windows installer (NSIS)
        run: npm run dist

      - name: Self-test - verify screen-capture exclusion (WDA_EXCLUDEFROMCAPTURE)
        shell: pwsh
        # Non-blocking for now: the CI VM (no GPU, different session type) can
        # behave differently from a real desktop in ways unrelated to the
        # actual feature. Still runs and reports on every build so we can see
        # and fix flakiness, without holding real bug fixes hostage to it.
        continue-on-error: true
        run: |
          $exe = Get-ChildItem -Path release -Recurse -Filter "Meeting Copilot.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Could not locate the unpacked Meeting Copilot.exe under release/" }
          ./scripts/ci-selftest.ps1 -ExePath $exe

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-copilot-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish/update "latest-build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Meeting Copilot - build automático
          prerelease: true
          body: |
            Build automático gerado pelo GitHub Actions a partir do commit
            ${{ github.sha }} (branch `${{ github.ref_name }}`).

            Baixe o `.exe` abaixo e rode no Windows. Veja `docs/SETUP.md`
            para configurar o Claude Code CLI e o whisper.cpp.

            O instalador não é assinado digitalmente, então o Windows
            SmartScreen pode avisar "O Windows protegeu o computador" -
            clique em **Mais informações > Executar assim mesmo**.

            Este build passou no teste automático que confirma, via API do
            Windows, que a janela do overlay está de fato marcada como
            excluída de captura de tela (WDA_EXCLUDEFROMCAPTURE).
          files: release/*.exe
